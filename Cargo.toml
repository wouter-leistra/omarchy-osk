[package]
name = "omarchy-osk"
version = "0.1.2"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/wouter-leistra/omarchy-osk"
readme = "README.md"
description = "Gboard-style on-screen keyboard for Omarchy (Hyprland), derived from wvkbd"

[[bin]]
name = "omarchy-oskd"
path = "src/main.rs"

[dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
xkbcommon = { version = "0.9", default-features = false }
cairo-rs = { version = "0.22", features = ["png"] }
pango = "0.22"
pangocairo = "0.22"
libc = "0.2"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
# function names stay, so crash backtraces (coredumpctl) still read well
strip = "debuginfo"
