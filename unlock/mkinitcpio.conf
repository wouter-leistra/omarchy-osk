# omarchy-osk-unlock: run the touch passphrase prompt before encrypt.
# Sorts after omarchy_hooks.conf, which sets HOOKS.
_osk_hooks=()
for _osk_hook in "${HOOKS[@]}"; do
  [[ $_osk_hook == omarchy-osk-unlock ]] && continue
  [[ $_osk_hook == encrypt ]] && _osk_hooks+=(omarchy-osk-unlock)
  _osk_hooks+=("$_osk_hook")
done
HOOKS=("${_osk_hooks[@]}")
unset _osk_hooks _osk_hook
