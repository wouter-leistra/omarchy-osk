# unl0kr at boot (omarchy-osk-unlock). Colours, font and wallpaper come from
# the Omarchy theme at initramfs build time (/etc/unl0kr.conf.d/50-omarchy.conf).
[general]
animations=false
backend=drm

[keyboard]
autohide=false
layout=us
popovers=true

[textarea]
obscured=true

[theme]
default=adwaita-dark
alternate=breezy-light

[input]
keyboard=true
pointer=true
touchscreen=true

[hardware keyboard]
layout=fi
